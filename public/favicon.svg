<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: dark rounded square matching app theme -->
  <rect width="512" height="512" rx="96" fill="#1a1a2e"/>

  <!-- Subtle radial glow behind the symbol -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#00e676" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#00e676" stop-opacity="0"/>
  </radialGradient>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- Power-symbol arc — 300° arc, 60° gap at 12 o'clock
       Start: ( 256 + 140·cos(−120°),  256 + 140·sin(−120°) ) = (186, 135)
       End:   ( 256 + 140·cos( −60°),  256 + 140·sin( −60°) ) = (326, 135)
       large-arc-flag=1, sweep=1 → goes the long way clockwise                -->
  <path d="M 186 135 A 140 140 0 1 1 326 135"
        fill="none"
        stroke="#00e676"
        stroke-width="28"
        stroke-linecap="round"/>

  <!-- Power-symbol vertical stem -->
  <line x1="256" y1="116" x2="256" y2="208"
        stroke="#00e676"
        stroke-width="28"
        stroke-linecap="round"/>

  <!-- Subtle outer ring echo -->
  <circle cx="256" cy="256" r="163"
          fill="none"
          stroke="#00e676"
          stroke-width="2"
          opacity="0.18"/>
</svg>
