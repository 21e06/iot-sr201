<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SR-201 Remote Control</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SR-201" />
  <!-- iOS requires a PNG apple-touch-icon; SVG is ignored -->
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <!-- Favicon: SVG for modern browsers, PNG fallback -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="loginCard" class="login-card">
    <div class="login-title">SR-201</div>
    <div class="divider"></div>
    <input class="login-input" type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" />
    <button class="btn-login" id="btnLogin">Unlock</button>
    <div class="divider"></div>
    <div class="login-error" id="loginError"></div>
  </div>

  <div id="remoteCard" class="remote" style="display:none">
    <div class="brand">SR-201</div>

    <div class="indicator-row">
      <div class="led" id="led"></div>
      <div class="status-text" id="statusText">—</div>
    </div>

    <div class="divider"></div>

    <div class="duration-row">
      <span class="duration-label">On Duration (sec)</span>
      <input class="duration-input" type="number" id="duration" min="1" max="86400" value="3600" />
    </div>

    <div class="timer" id="timer">—</div>

    <div class="buttons">
      <button class="btn btn-on" id="btnOn">ON</button>
      <button class="btn btn-off" id="btnOff">OFF</button>
    </div>

    <div class="divider"></div>

    <div class="message" id="message"></div>
  </div>

  <button class="btn-logout" id="btnLogout" style="display:none">Logout</button>

  <script src="/app.js" defer></script>
</body>
</html>
