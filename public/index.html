<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SR-201 Remote Control</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SR-201" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <div id="loginCard" class="login-screen">
    <div class="login-form">
      <div class="brand">SR-201</div>
      <div class="divider"></div>
      <input class="text-input" type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" />
      <button class="btn-primary" id="btnLogin">Unlock</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <div id="remoteCard" class="remote-screen" style="display:none">
    <header class="app-header">
      <div class="brand">SR-201</div>
      <div class="indicator-row">
        <div class="led" id="led"></div>
        <div class="status-text" id="statusText">—</div>
      </div>
    </header>

    <main class="app-main">
      <div class="timer" id="timer">—</div>
      <button class="btn-toggle" id="btnToggle">ON</button>
    </main>

    <footer class="app-footer">
      <div class="duration-row">
        <span class="duration-label">Duration (sec)</span>
        <input class="text-input" type="number" id="duration" min="1" max="86400" value="3600" />
      </div>
      <div class="message" id="message"></div>
      <button class="btn-logout" id="btnLogout">Logout</button>
    </footer>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
