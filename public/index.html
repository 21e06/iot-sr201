<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SR-201 Remote Control</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .remote {
      background: linear-gradient(160deg, #2d2d44 0%, #1e1e30 100%);
      border-radius: 36px;
      padding: 36px 28px 40px;
      width: 220px;
      box-shadow:
        0 0 0 2px #3a3a58,
        0 20px 60px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.07);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .brand {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #5a5a88;
    }

    .indicator-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .led {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2a2a40;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .led.on  { background: #00e676; box-shadow: 0 0 8px #00e676, 0 0 20px #00e67655; }
    .led.off { background: #ff1744; box-shadow: 0 0 8px #ff1744, 0 0 20px #ff174455; }

    .status-text {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #5a5a88;
      min-width: 28px;
    }
    .status-text.on  { color: #00e676; }
    .status-text.off { color: #ff1744; }

    .duration-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .duration-label {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #5a5a88;
    }

    .duration-input {
      width: 100%;
      background: #13131f;
      border: 1px solid #3a3a58;
      border-radius: 10px;
      color: #c0c0e0;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      padding: 8px 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    .duration-input:focus { border-color: #6060aa; }

    .buttons {
      display: flex;
      gap: 16px;
    }

    .btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      position: relative;
      transition: transform 0.1s, box-shadow 0.1s;
      user-select: none;
    }
    .btn:active { transform: scale(0.93); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .btn-on {
      background: linear-gradient(145deg, #00e676, #00b248);
      color: #003d1a;
      box-shadow: 0 6px 20px rgba(0,230,118,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
    }
    .btn-on:hover:not(:disabled) { box-shadow: 0 8px 28px rgba(0,230,118,0.5), inset 0 1px 0 rgba(255,255,255,0.25); }

    .btn-off {
      background: linear-gradient(145deg, #ff5252, #c62828);
      color: #3d0000;
      box-shadow: 0 6px 20px rgba(255,82,82,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .btn-off:hover:not(:disabled) { box-shadow: 0 8px 28px rgba(255,82,82,0.5), inset 0 1px 0 rgba(255,255,255,0.2); }

    .message {
      font-size: 11px;
      color: #5a5a88;
      text-align: center;
      min-height: 16px;
      letter-spacing: 0.5px;
      transition: color 0.3s;
    }
    .message.error { color: #ff5252; }
    .message.success { color: #00e676; }

    .divider {
      width: 60%;
      height: 1px;
      background: linear-gradient(to right, transparent, #3a3a58, transparent);
    }
  </style>
</head>
<body>
  <div class="remote">
    <div class="brand">SR-201</div>

    <div class="indicator-row">
      <div class="led" id="led"></div>
      <div class="status-text" id="statusText">—</div>
    </div>

    <div class="divider"></div>

    <div class="duration-row">
      <span class="duration-label">On Duration (sec)</span>
      <input class="duration-input" type="number" id="duration" min="1" max="86400" value="3600" />
    </div>

    <div class="buttons">
      <button class="btn btn-on" id="btnOn">ON</button>
      <button class="btn btn-off" id="btnOff">OFF</button>
    </div>

    <div class="divider"></div>

    <div class="message" id="message"></div>
  </div>

  <script>
    const led        = document.getElementById('led');
    const statusText = document.getElementById('statusText');
    const btnOn      = document.getElementById('btnOn');
    const btnOff     = document.getElementById('btnOff');
    const duration   = document.getElementById('duration');
    const message    = document.getElementById('message');

    function setStatus(state) {
      led.className = 'led ' + state;
      statusText.className = 'status-text ' + state;
      statusText.textContent = state === 'on' ? 'ON' : state === 'off' ? 'OFF' : '—';
    }

    function setMessage(text, type = '') {
      message.textContent = text;
      message.className = 'message ' + type;
    }

    async function sendCommand(seconds) {
      btnOn.disabled = true;
      btnOff.disabled = true;
      setMessage('Sending…');

      try {
        const res = await fetch('/bridge', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ seconds }),
        });

        if (!res.ok) {
          const text = await res.text();
          throw new Error(text || `HTTP ${res.status}`);
        }

        setStatus(seconds > 0 ? 'on' : 'off');
        setMessage(seconds > 0 ? `On for ${seconds}s` : 'Relay off', 'success');
      } catch (err) {
        setMessage(err.message, 'error');
      } finally {
        btnOn.disabled = false;
        btnOff.disabled = false;
      }
    }

    btnOn.addEventListener('click', () => {
      const secs = parseInt(duration.value, 10);
      if (!secs || secs < 1) { setMessage('Enter a valid duration', 'error'); return; }
      sendCommand(secs);
    });

    btnOff.addEventListener('click', () => sendCommand(0));
  </script>
</body>
</html>
