<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed background (no rounded corners) for adaptive icon masking -->
  <rect width="512" height="512" fill="#1a1a2e"/>

  <!-- Radial glow — kept within safe zone (inner 80% = r≤204) -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#00e676" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#00e676" stop-opacity="0"/>
  </radialGradient>
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>

  <!-- Power symbol scaled to ~0.75× so it sits safely inside the safe zone
       Original r=140 → r=105; gap endpoints recalculated:
         Start: (256 + 105·cos(−120°), 256 + 105·sin(−120°)) = (203.5, 165)
         End:   (256 + 105·cos( −60°), 256 + 105·sin( −60°)) = (308.5, 165)    -->
  <path d="M 203.5 165 A 105 105 0 1 1 308.5 165"
        fill="none"
        stroke="#00e676"
        stroke-width="28"
        stroke-linecap="round"/>

  <!-- Stem: top of scaled circle (256, 256−105) = (256, 151) to (256, 220) -->
  <line x1="256" y1="151" x2="256" y2="228"
        stroke="#00e676"
        stroke-width="28"
        stroke-linecap="round"/>

  <!-- Outer ring echo inside safe zone -->
  <circle cx="256" cy="256" r="128"
          fill="none"
          stroke="#00e676"
          stroke-width="2"
          opacity="0.2"/>
</svg>
